name: Task
description: Major feature or change
title: "[task] "
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What needs to be built or changed?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know it's done?
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Relevant context, links, or constraints.
