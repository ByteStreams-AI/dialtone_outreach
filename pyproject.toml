[project]
name = "dialtone-outreach"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.12"
dependencies = [
    "dnspython>=2.8.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.20",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "developer", "deploy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E501: line length is enforced by formatter, not the linter — many of
# the existing template strings are intentionally long.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
