[project]
name = "lead-discovery-scraper"
version = "0.1.0"
description = "Neutral scraper starter for restaurant lead discovery"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.0",
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "pydantic>=2.8.0",
    "tenacity>=8.2.0",
    "rich>=13.0.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
dialtone = "cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["scraper*", "lead_tools*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "developer"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
